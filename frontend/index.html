<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>АвтоСумма — оценка авто, аукционы Японии и расчёт импорта</title>
    <meta
    name="description"
    content="Полный отчёт по автомобилю: рыночная оценка, лоты японских аукционов, похожие объявления и стоимость импорта под ключ."
    />
    <meta name="yandex-verification" content="c8eeedf6eb3988ee" />
    <meta name="google-site-verification" content="Q5W-2PxOh0xgjeNejar11SEbF39Xe8maNhsoqFyyLtc" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "АвтоСумма",
      "description": "Сравнение стоимости покупки автомобилей в России и импорта из Японии",
      "url": "https://avto-summa.ru/"
    }
</script>
  </head>
  <body>
    <div id="root">
      <main id="startup" style="max-width:32rem;margin:12vh auto 0;padding:0 1rem;color:#17181c;font:1rem/1.5 system-ui,sans-serif">
        <h1 style="margin:0 0 .5rem;font-size:1.5rem">АвтоСумма</h1>
        <p id="startup-status" role="status">Загружаем сравнение цен…</p>
        <button id="startup-reload" type="button" hidden onclick="location.reload()">Обновить страницу</button>
        <noscript>Для расчёта стоимости включите JavaScript в браузере.</noscript>
      </main>
    </div>
    <script>
      const showStartupFailure = () => {
        const status = document.getElementById('startup-status')
        if (!status) return
        status.textContent = 'Не удалось загрузить АвтоСумма. Попробуйте обновить страницу.'
        document.getElementById('startup-reload').hidden = false
      }
      window.addEventListener('error', (event) => {
        if (event.target.type === 'module' || event.target.rel === 'stylesheet') showStartupFailure()
      }, true)
      window.setTimeout(showStartupFailure, 12_000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
