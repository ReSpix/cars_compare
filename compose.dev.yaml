services:
  api:
    volumes:
      - ./src:/app/src
    command:
      - uv
      - run
      - --frozen
      - --no-sync
      - uvicorn
      - app.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
