services:
  api:
    volumes:
      - ./src:/app/src
    command:
      - uv
      - run
      - --frozen
      - --no-sync
      - uvicorn
      - app.main:app
      - --app-dir
      - src
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src

  frontend:
    ports: !override
      - "80:5173"
    build:
      target: development
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
    environment:
      VITE_BACKEND_URL: http://api:8000
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
