services:
  api:
    ports: !reset []
    restart: unless-stopped
    logging: &rotated_logs
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    ports: !reset []
    build:
      args:
        VITE_METRIKA_COUNTER_ID: ${VITE_METRIKA_COUNTER_ID:-}
    restart: unless-stopped
    logging: *rotated_logs

  caddy:
    image: caddy:2-alpine
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend
    logging: *rotated_logs

volumes:
  caddy_data:
  caddy_config:
